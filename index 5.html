<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generatore Verifiche 1.0 – Test 1</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fb;color:#172b49;font:16px system-ui}header{background:#173f7d;color:white;padding:22px}main{max-width:1000px;margin:auto;padding:16px}section{background:white;border:1px solid #d6e0ef;border-radius:14px;padding:18px;margin-bottom:14px}label{display:inline-flex;flex-direction:column;gap:5px;margin:8px}input,select,button{font:inherit;padding:10px;border:1px solid #b8c9de;border-radius:8px}button{background:#2159a4;color:white;cursor:pointer;margin:5px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}pre{white-space:pre-wrap} @media print{header,section:not(#preview),button{display:none!important}body{background:white}#preview{border:0}}
</style><header><h1>Generatore Verifiche 1.0 – Test 1</h1>Area docente · Offline</header><main>
<section><h2>1. Configura</h2><label>Titolo<input id="title" value="Verifica di relazioni"></label><label>Modulo<select id="module"><option>Relazioni</option></select></label><label>Esercizi<input id="number" type="number" min="1" max="30" value="3"></label><label>Difficoltà<select id="level"><option value="3">Facile</option><option value="4">Media</option><option value="6">Difficile</option></select></label><label>Minuti<input id="minutes" type="number" min="1" max="180" value="30"></label><label>Studenti<input id="students" type="number" min="1" max="100" value="25"></label><label>Punti per rappresentazione<input id="viewPoints" type="number" min="0" max="100" value="2"></label><label>Punti proprietà<input id="propPoints" type="number" min="0" max="100" value="4"></label><button id="generate">Genera verifica</button></section>
<section><h2>2. Distribuzione</h2><button id="export">JSON studenti</button><button id="archive">Archivio docente JSON</button><button onclick="window.print()">Stampa / salva PDF</button><p>Conserva l'archivio docente. Distribuisci il pacchetto studenti e comunica individualmente i codici.</p></section>
<section id="preview"><h2>Anteprima verifica</h2><div id="summary">Genera una verifica.</div></section>
<section><h2>3. Correzione</h2><label>Archivio docente<input type="file" id="restore" accept=".json"></label><label>Elaborati studenti<input type="file" id="submissions" accept=".json" multiple></label><button id="grade">Correggi elaborati</button><div id="results"></div></section></main><script>
const $=x=>document.getElementById(x), views=['graph','matrix','cartesian','sagittal'],names=['Grafo orientato','Tabella a doppia entrata','Diagramma cartesiano','Diagramma sagittale'];let exam=null,records=new Map();
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Array.from(crypto.getRandomValues(new Uint32Array(2)),x=>x.toString(36)).join('').toUpperCase();
function props(t){let n=t.elements.length,r=new Set(t.pairs),h=(i,j)=>r.has(i+','+j),f={reflexive:true,irreflexive:true,symmetric:true,antisymmetric:true,transitive:true};for(let i=0;i<n;i++){if(!h(i,i))f.reflexive=false;if(h(i,i))f.irreflexive=false;for(let j=0;j<n;j++)if(h(i,j)){if(!h(j,i))f.symmetric=false;if(i!==j&&h(j,i))f.antisymmetric=false;for(let k=0;k<n;k++)if(h(j,k)&&!h(i,k))f.transitive=false}}let a=Object.keys(f).filter(k=>f[k]);return a.length?a:['none']}
function task(n,i){let elements='abcdef'.slice(0,n).split(''),pairs=[],pattern=i%5;for(let a=0;a<n;a++)for(let b=0;b<n;b++){let yes=pattern===1?a<=b:pattern===2?a===b:pattern===3?(a+b)%2===0:Math.random()<.35;if(yes)pairs.push(a+','+b)}return {module:'relations',id:'Q'+(i+1),elements,pairs,source:views[Math.floor(Math.random()*4)]}}
const save=(o,n)=>{let u=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
function preview(){records.clear();$('results').textContent='';$('summary').innerHTML=`<h3>${esc(exam.title)}</h3><p>${exam.minutes} minuti · ${exam.tasks.length} esercizi · ${exam.tasks.length*(3*exam.viewPoints+exam.propPoints)} punti</p>`+exam.tasks.map((t,i)=>`<p><b>${i+1}.</b> A = {${t.elements.join(', ')}} · Rappresentazione assegnata: ${names[views.indexOf(t.source)]}. Completa le altre tre e individua le proprietà.</p>`).join('')+'<h3>Codici personali (riservati al docente)</h3>'+exam.codes.map((c,i)=>`${i+1}. ${esc(c)}`).join(' · ')}
$('generate').onclick=()=>{let fields=['number','minutes','students','viewPoints','propPoints'];if(fields.some(k=>!$(k).checkValidity()||$(k).value===''))return alert('Controlla i valori.');let n=+$('number').value,v=+$('viewPoints').value,p=+$('propPoints').value;if(!v&&!p)return alert('Assegna almeno un punto.');exam={schema:'lab.exam.v1',id:uid(),title:$('title').value,minutes:+$('minutes').value,viewPoints:v,propPoints:p,codes:Array.from({length:+$('students').value},()=>uid().slice(0,10)),tasks:Array.from({length:n},(_,i)=>task(+$('level').value,i))};preview()};
$('export').onclick=()=>{if(!exam)return alert('Genera prima.');let {viewPoints,propPoints,...pub}=exam;save(pub,'verifica-'+exam.id+'.json')};
$('archive').onclick=()=>exam?save(exam,'docente-'+exam.id+'.json'):alert('Genera prima.');
$('restore').onchange=async()=>{try{let x=JSON.parse(await $('restore').files[0].text());if(x.schema!=='lab.exam.v1'||!Number.isFinite(x.viewPoints)||!Number.isFinite(x.propPoints)||!Array.isArray(x.tasks))throw Error('Archivio non valido');exam=x;preview()}catch(e){alert(e.message)}};
const equal=(a,b)=>Array.isArray(a)&&a.length===b.length&&new Set(a).size===b.length&&b.every(x=>a.includes(x));
$('grade').onclick=async()=>{if(!exam)return alert('Carica archivio docente.');let errors=[];for(let file of $('submissions').files){try{let r=JSON.parse(await file.text());if(r.schema!=='lab.submission.v1'||r.examId!==exam.id||!exam.codes.includes(r.code)||!r.responses)throw Error('Elaborato non compatibile');let scores=exam.tasks.map((t,i)=>{let a=r.responses[i]||{},s=0;for(let v of views)if(v!==t.source&&equal(a.views?.[v],t.pairs))s+=exam.viewPoints;if(equal(a.props,props(t)))s+=exam.propPoints;return s});records.set(r.code,scores)}catch(e){errors.push(file.name+': '+e.message)}}let max=exam.tasks.length*(3*exam.viewPoints+exam.propPoints);$('results').innerHTML='<table><tr><th>Codice</th><th>Punti per esercizio</th><th>Totale</th><th>Voto /10</th></tr>'+[...records].map(([c,s])=>{let sum=s.reduce((a,b)=>a+b,0);return `<tr><td>${esc(c)}</td><td>${s.join(' · ')}</td><td>${sum}/${max}</td><td>${(10*sum/max).toFixed(2)}</td></tr>`}).join('')+'</table>'+errors.map(e=>'<p>'+esc(e)+'</p>').join('')};
</script></html>
